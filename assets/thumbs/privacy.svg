<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 854" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img"><defs><radialGradient id="kpriv-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a1f" stop-opacity="0.35"/><stop offset="0.55" stop-color="#ff5a1f" stop-opacity="0.10"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/></radialGradient><radialGradient id="kpriv-glow2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6c8cff" stop-opacity="0.22"/><stop offset="1" stop-color="#6c8cff" stop-opacity="0"/></radialGradient><linearGradient id="kpriv-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1c20"/><stop offset="1" stop-color="#17171a"/></linearGradient></defs><g font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e8e6e2"><rect x="0" y="0" width="1200" height="854" fill="#0f0f11"/><ellipse cx="1090" cy="-40" rx="520" ry="380" fill="url(#kpriv-glow)"/><ellipse cx="60" cy="900" rx="440" ry="320" fill="url(#kpriv-glow2)"/><rect x="64" y="64" width="1072" height="726" rx="32" fill="url(#kpriv-card)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/><rect x="76" y="76" width="1048" height="702" rx="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/><circle cx="116" cy="128" r="9" fill="#ff5a1f"/><text x="140" y="135" font-size="30" font-weight="600">Private by design</text><text x="1084" y="133" font-size="19" fill="#9a9aa1" text-anchor="end">No accounts</text><rect x="100" y="160" width="1000" height="1" fill="rgba(255,255,255,0.10)"/><path d="M 300 300 L 408 256 L 516 300 C 516 450 500 536 408 582 C 316 536 300 450 300 300 L 300 300 Z" fill="#ff5a1f" fill-opacity="0.12" stroke="#ff5a1f" stroke-width="3" stroke-linejoin="round"/><path d="M 378 408 v -28 a 30 30 0 0 1 60 0 v 28" fill="none" stroke="#ff5a1f" stroke-width="12" stroke-linecap="round"/><rect x="356" y="408" width="104" height="84" rx="18" fill="#ff5a1f"/><circle cx="408" cy="444" r="9" fill="#12100f"/><rect x="404" y="448" width="8" height="22" rx="4" fill="#12100f"/><text x="620" y="300" font-size="44" font-weight="700">On-device</text><text x="620" y="342" font-size="20" fill="#9a9aa1">Your roster is computed and stored on your iPhone.</text><rect x="620" y="384" width="464" height="1" fill="rgba(255,255,255,0.10)"/><text x="620" y="448" font-size="44" fill="#6c8cff" font-weight="700">CloudKit</text><text x="620" y="490" font-size="20" fill="#9a9aa1">Optional sync in your own private database.</text><circle cx="632" cy="546" r="12" fill="#37c98b" fill-opacity="0.2"/><path d="M 626 546 l 6 7 l 12 -14" fill="none" stroke="#37c98b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="660" y="553" font-size="21">No third-party analytics</text><circle cx="632" cy="602" r="12" fill="#37c98b" fill-opacity="0.2"/><path d="M 626 602 l 6 7 l 12 -14" fill="none" stroke="#37c98b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="660" y="609" font-size="21">No advertising identifiers</text><circle cx="632" cy="658" r="12" fill="#37c98b" fill-opacity="0.2"/><path d="M 626 658 l 6 7 l 12 -14" fill="none" stroke="#37c98b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="660" y="665" font-size="21">No account, no email address</text><text x="116" y="760" font-size="19" fill="#9a9aa1">Nothing leaves the device unless you ask it to.</text></g></svg>
