<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found — Kairos</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="favicon.ico" sizes="48x48" />
<link rel="icon" href="icon.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#0b0b0f" />
<meta name="color-scheme" content="dark" />
<style>
  :root {
    --ink: #0b0b0f;
    --paper: #f4f1ea;
    --flame: #ff5a1f;
  }
  * { box-sizing: border-box; }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--flame);
    outline-offset: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
  }
  .eyebrow {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--flame);
    margin: 0 0 26px;
  }
  h1 {
    margin: 0 0 24px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    line-height: 0.95;
    font-size: clamp(46px, 10vw, 108px);
  }
  p.sub {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 1.6;
    max-width: 460px;
    margin: 0 0 44px;
    opacity: 0.72;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 28px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    background: var(--flame);
    color: var(--ink);
    font-weight: 700;
    transition: background 0.15s ease;
  }
  .btn:hover { background: #ff7440; }
  .brand-mark {
    position: absolute;
    top: 28px;
    left: 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .brand-mark img { width: 24px; height: 24px; }
  .brand-mark a { color: var(--paper); text-decoration: none; display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
  <div class="brand-mark">
    <a href="/">
      <img src="icon.png" alt="Kairos" width="300" height="300" />
      Kairos
    </a>
  </div>
  <div class="wrap">
    <main>
    <p class="eyebrow">404 · Off Schedule</p>
    <h1>Wrong<br />Rotation</h1>
    <p class="sub">This page isn't on the calendar. Head back and we'll get you sorted.</p>
    <a class="btn" href="/">Back to Kairos</a>
    </main>
  </div>
</body>
</html>
