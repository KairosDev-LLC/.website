name: site-durability

# Every push and pull request must keep the site deployable: no dead links,
# no missing assets, no unparseable JavaScript, no sitemap drift.
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly run catches outbound link rot (App Store / Apple EULA URLs)
    # even when nobody has touched the repository.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Structural checks (offline)
        run: python3 tools/check_site.py

      - name: Outbound link check
        # Network flakiness must not fail a code review, so this is advisory
        # on PRs but authoritative on the weekly schedule.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 tools/check_site.py --external

      - name: Advisory outbound link check
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        run: python3 tools/check_site.py --external
